# Small real-model demo that runs on a CPU (no GPU required; ~5 GB RAM, slow but usable).
#   routeguard run --config configs/local_cpu.yaml --query "What is 17 * 23?" --answer-type numeric
extends: local_hf.yaml
name: routeguard-cpu
models:
  - name: qwen3-0.6b
    backend: huggingface
    model_id: Qwen/Qwen3-0.6B
    params_b: 0.596
    max_new_tokens: 256
    options: {revision: c1899de289a04d12100db370d81485cdf75e47ca, device: cpu, batch_size: 4,
              chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3-1.7b
    backend: huggingface
    model_id: Qwen/Qwen3-1.7B
    params_b: 1.721
    max_new_tokens: 256
    options: {revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e, device: cpu, batch_size: 4,
              chat_template_kwargs: {enable_thinking: false}}
cache: {path: .routeguard_cache/cpu.sqlite}
