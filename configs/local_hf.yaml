# Three-model local pool on one GPU (Hugging Face Transformers).
#
# Qwen3 0.6B / 1.7B / 8B (Apache-2.0), one family so that capability differences are not
# confounded with tokenizer or training-data differences. "Thinking" mode is disabled so all
# models answer in the same format. Revisions are pinned for reproducibility.
# Memory: ~18 GB of GPU memory for all three in bf16 (loaded lazily, only when used).
# Replace model_id with any chat model; nothing in RouteGuard assumes this family.
name: routeguard-hf
seed: 0

models:
  - name: qwen3-0.6b
    backend: huggingface
    model_id: Qwen/Qwen3-0.6B
    params_b: 0.596
    max_new_tokens: 512
    options: {revision: c1899de289a04d12100db370d81485cdf75e47ca, batch_size: 32,
              chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3-1.7b
    backend: huggingface
    model_id: Qwen/Qwen3-1.7B
    params_b: 1.721
    max_new_tokens: 512
    options: {revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e, batch_size: 32,
              chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3-8b
    backend: huggingface
    model_id: Qwen/Qwen3-8B
    params_b: 8.191
    max_new_tokens: 512
    options: {revision: b968826d9c46dd6066d109eabc6255188de91218, batch_size: 32,
              chat_template_kwargs: {enable_thinking: false}}

analyzer: {languages: [en, kk, ru, fa, ar], task_classifier: rules}
difficulty: {estimator: heuristic}
router: {type: threshold}
confidence: {method: mean_token_prob, calibration: isotonic, min_samples: 30}
verification: {verifiers: [format, arithmetic, code_execution]}
escalation:
  enabled: true
  triggers: {confidence_below: 0.5, on_verification_failure: true}
  stages: [{type: stronger_model}, {type: stronger_model}]
  max_stages: 2
cache: {path: .routeguard_cache/hf.sqlite}
