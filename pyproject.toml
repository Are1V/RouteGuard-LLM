[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeguard-llm"
version = "0.1.0"
description = "Reliability-aware adaptive routing for cost-efficient, multilingual LLM inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mirwais Mohebi" }]
keywords = ["llm", "routing", "uncertainty", "calibration", "multilingual", "inference", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.43", "accelerate>=0.30"]
data = ["datasets>=2.18"]
embeddings = ["sentence-transformers>=2.6"]
xgboost = ["xgboost>=2.0"]
dashboard = ["gradio>=4.20"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "fastapi>=0.115",
  "httpx>=0.27",
]

[project.scripts]
routeguard = "routeguard.cli:main"

[tool.setuptools.packages.find]
include = ["routeguard*", "apps*"]

[tool.setuptools.package-data]
routeguard = ["py.typed", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that run a full (simulated) benchmark end to end",
  "gpu: tests that require a real model on a GPU (never run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # multilingual text legitimately contains non-ASCII lookalikes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
packages = ["routeguard"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
